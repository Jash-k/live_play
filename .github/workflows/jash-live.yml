name: Refresh Tamil, sports and Bigg Boss playlist

on:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours (GitHub may delay scheduled runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/jash-live.yml'

permissions:
  contents: write

concurrency:
  group: jash-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test curation rules (offline fixtures)
        run: node scripts/test-curate-live.mjs

      - name: Refresh and curate upstream metadata
        run: node scripts/curate-live.mjs

      - name: Validate published playlists
        run: node scripts/validate.mjs --dir .

      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jash-live.m3u jash-review.m3u jash-live.stats.json jash-review.json CHANNEL-SUMMARY.md
          if git diff --cached --quiet; then
            echo 'No playlist changes this run.'
            exit 0
          fi
          git commit -m 'Refresh Tamil channels, sports and Bigg Boss Tamil'
          git pull --rebase origin main
          git push origin HEAD:main
