name: Refresh Tamil Bigg Boss and sports
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/curate-live.mjs'
      - 'scripts/curate-live.config.json'
      - 'scripts/test-curate-live.mjs'
      - '.github/workflows/jash-live.yml'
permissions:
  contents: write
concurrency:
  group: jash-live-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test filtering and metadata preservation
        run: node scripts/test-curate-live.mjs
      - name: Refresh and curate upstream metadata
        run: node scripts/curate-live.mjs
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jash-live.m3u jash-review.m3u jash-live.stats.json jash-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Tamil Bigg Boss and Tamil/English sports'
          git pull --rebase origin main
          git push origin HEAD:main
